# ~/.tmux.conf
# tmux was installed but had no configuration on this machine.
# Reload after editing:  tmux source-file ~/.tmux.conf   (or prefix + r)

# ─── Colour ──────────────────────────────────────────────────────────────────
# Ghostty advertises itself as xterm-256color and supports true colour. The Tc
# override tells tmux that, so 24-bit colour survives inside a session.
# Without it, Neovim colourschemes degrade to 256 colours under tmux.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc,ghostty:Tc"

# ─── Prefix ──────────────────────────────────────────────────────────────────
# Ctrl-a rather than the default Ctrl-b: reachable without moving off home row.
# Press it twice to send a literal Ctrl-a through to the running program.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General behaviour ───────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10          # 500ms default makes ESC feel laggy in Neovim
set -g focus-events on          # lets Neovim's autoread and lualine react
set -g display-time 2000
setw -g aggressive-resize on

# ─── Windows and panes: 1-indexed ────────────────────────────────────────────
# The 0 key is at the far end of the row, so 0-indexing makes the first window
# the most awkward to reach.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on      # closing window 2 renumbers 3 -> 2

# ─── Splits: keep the current directory ──────────────────────────────────────
# Default new-window/split starts in $HOME, which is almost never wanted.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Pane navigation (vim keys) ──────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize, repeatable (-r): hold the key without re-pressing the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Copy mode: vi keys, system clipboard ────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ─── Reload ──────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ─── Status bar ──────────────────────────────────────────────────────────────
# Catppuccin Mocha palette, matching the Ghostty theme.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#a6adc8]%H:%M  #[bg=#89b4fa,fg=#1e1e2e,bold] #h "
set -g status-right-length 40
setw -g window-status-current-style "fg=#89b4fa,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#89b4fa,fg=#1e1e2e"
